<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lộ trình Tiếng Anh 6 Tháng - Corporate Banking</title>
<style>
:root {
  --bg:#f4f7fb; --card:#fff; --ink:#172033; --muted:#667085; --line:#e4e9f2;
  --accent:#3157d5; --accent-soft:#eef2ff; --ok:#1c8b62; --warn:#c57912;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.wrap{max-width:1200px;margin:auto;padding:18px}
.hero{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:center}
h1{font-size:28px;margin:0 0 6px} .subtitle{color:var(--muted);font-size:14px}
.progressBox{background:#f8faff;border:1px solid var(--line);border-radius:16px;padding:14px}
.progressRow{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px}
.bar{height:12px;background:#e9edf7;border-radius:20px;overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,#3157d5,#6b7ff2);transition:.3s}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
input[type="search"], select{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px}
input[type="search"]{flex:1;min-width:220px}
main{max-width:1200px;margin:0 auto;padding:18px}
.monthTabs{display:flex;gap:8px;overflow:auto;padding-bottom:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.dayList{display:grid;gap:12px}
.dayCard{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 2px 8px rgba(16,24,40,.03)}
.dayHead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:14px 16px;cursor:pointer}
.dayNum{width:48px;height:48px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-weight:800;color:var(--accent)}
.dayTitle h3{margin:0 0 4px;font-size:17px} .dayTitle div{font-size:12px;color:var(--muted)}
.status{font-size:12px;padding:6px 9px;border-radius:999px;background:#f3f4f6;color:var(--muted)}
.status.done{background:#eaf8f1;color:var(--ok)}
.content{display:none;border-top:1px solid var(--line);padding:16px}
.dayCard.open .content{display:block}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.section{background:#fbfcfe;border:1px solid var(--line);border-radius:14px;padding:14px}
.section h4{margin:0 0 10px;font-size:14px}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{background:#fff;border:1px solid #dfe5ef;border-radius:999px;padding:6px 9px;font-size:12px}
.speech{font-size:15px;line-height:1.65;white-space:pre-wrap}
.vn{color:#455067}
.tasks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.task{border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff}
.task label{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.4}
.task input[type="checkbox"]{width:18px;height:18px;accent-color:var(--accent)}
.completeRow{display:grid;grid-template-columns:1fr 220px;gap:10px;margin-top:12px}
.note{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;min-height:42px}
.date{border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit}
.legend{font-size:12px;color:var(--muted);margin-top:6px}
.empty{text-align:center;color:var(--muted);padding:40px}
.footer{text-align:center;color:var(--muted);font-size:12px;padding:28px}
@media(max-width:760px){
  .hero,.grid2{grid-template-columns:1fr}
  .tasks{grid-template-columns:1fr}
  .completeRow{grid-template-columns:1fr}
  .dayHead{grid-template-columns:auto 1fr} .status{grid-column:2}
}

.questions{display:grid;gap:8px;margin-top:10px}
.q{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.45}
.todayMark{outline:3px solid rgba(49,87,213,.22)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hero">
      <div>
        <h1>English for Corporate Banking — 180 ngày · V2</h1>
        <div class="subtitle">35–45 phút/ngày · Bài nói riêng từng ngày · Câu hỏi phản xạ · 3 lượt luyện · Theo dõi streak</div>
      </div>
      <div class="progressBox">
        <div class="progressRow"><b>Tiến độ toàn khóa</b><span id="progressText">0/180 ngày</span></div>
        <div class="bar"><div id="progressFill" class="fill"></div></div>
        <div class="legend" id="taskText">0/540 lượt luyện đã hoàn thành</div><div class="legend" id="streakText">🔥 Streak: 0 ngày</div>
      </div>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Tìm chủ đề, từ vựng, cấu trúc...">
      <select id="statusFilter">
        <option value="all">Tất cả trạng thái</option>
        <option value="todo">Chưa hoàn thành</option>
        <option value="done">Đã hoàn thành</option>
      </select>
      <button class="tab" id="todayBtn" type="button">📍 Hôm nay học bài nào?</button><button class="tab" id="resetBtn" type="button">Xóa tiến độ</button>
    </div>
  </div>
</header>

<main>
  <div class="monthTabs" id="monthTabs"></div>
  <div class="dayList" id="dayList"></div>
</main>
<div class="footer">Dữ liệu tiến độ được lưu bằng LocalStorage trên chính trình duyệt của bạn.</div>

<script>
const curriculum = [{"day": 1, "month": 1, "title": "Giới thiệu bản thân và công việc", "vocab": ["corporate banking", "credit solution", "business customer", "responsibility", "develop credit products", "analyze customer needs", "business unit", "structure a financing solution", "bank guarantee", "factoring"], "structures": ["I work in + lĩnh vực", "I mainly focus on + noun/V-ing", "My responsibilities include + V-ing", "I also work on + noun", "I have been trying to + V", "so that I can + V"], "english": "Hello, my name is Lien. I work in corporate banking, mainly focusing on credit solutions for business customers. My responsibilities include developing credit products, analyzing customer needs, and supporting business units in structuring suitable financing solutions. I also work on projects related to construction companies, bank guarantees, and factoring. Recently, I have been trying to improve my English, data analysis and AI skills so that I can work more efficiently and make better business decisions.", "vietnamese": "Xin chào, tôi tên là Liên. Tôi làm việc trong lĩnh vực ngân hàng doanh nghiệp, chủ yếu tập trung vào các giải pháp tín dụng cho khách hàng doanh nghiệp. Công việc của tôi bao gồm phát triển sản phẩm tín dụng, phân tích nhu cầu khách hàng và hỗ trợ các đơn vị kinh doanh cấu trúc giải pháp tài trợ phù hợp. Tôi cũng làm các dự án liên quan đến doanh nghiệp xây dựng, bảo lãnh ngân hàng và bao thanh toán. Gần đây tôi đang cố gắng cải thiện tiếng Anh, kỹ năng phân tích dữ liệu và AI để làm việc hiệu quả hơn và đưa ra quyết định kinh doanh tốt hơn.", "questions": ["What is the most important point about Giới thiệu bản thân và công việc?", "Can you explain corporate banking in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 2, "month": 1, "title": "Corporate Banking", "vocab": ["corporate banking", "relationship manager", "loan", "overdraft", "guarantee", "letter of credit", "factoring", "cash management", "financing", "long-term needs"], "structures": ["Corporate banking provides + noun", "The key role of... is to + V", "not only... but also...", "A good solution should + V"], "english": "Corporate banking provides financial services to business customers. These services may include loans, overdrafts, guarantees, letters of credit, factoring and cash management. In my view, the key role of a corporate banker is not only to provide financing but also to understand the customer's business model, cash flow, risks and long-term needs. A good banking solution should create value for both the customer and the bank.", "vietnamese": "Ngân hàng doanh nghiệp cung cấp các dịch vụ tài chính cho khách hàng doanh nghiệp. Các dịch vụ này có thể bao gồm cho vay, thấu chi, bảo lãnh, thư tín dụng, bao thanh toán và quản lý dòng tiền. Theo tôi, vai trò quan trọng của một cán bộ ngân hàng doanh nghiệp không chỉ là cung cấp vốn mà còn phải hiểu mô hình kinh doanh, dòng tiền, rủi ro và nhu cầu dài hạn của khách hàng. Một giải pháp ngân hàng tốt nên tạo giá trị cho cả khách hàng và ngân hàng.", "questions": ["What is the most important point about Corporate Banking?", "Can you explain corporate banking in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 3, "month": 1, "title": "Giới thiệu một doanh nghiệp", "vocab": ["established in", "headquartered in", "engaged in", "operates in", "contractor", "supplier", "project owner", "private developer", "public-sector client", "revenue source"], "structures": ["The company was established...", "It operates mainly in...", "Its main business activities include...", "Most of its revenue comes from..."], "english": "The company was established more than ten years ago and operates mainly in the construction sector. Its main business activities include civil construction, infrastructure development and mechanical and electrical works. The company has participated in several large projects and works with both private developers and public-sector clients. Most of its revenue comes from construction contracts.", "vietnamese": "Doanh nghiệp được thành lập hơn mười năm trước và hoạt động chủ yếu trong lĩnh vực xây dựng. Hoạt động kinh doanh chính bao gồm xây dựng dân dụng, phát triển hạ tầng và cơ điện. Công ty đã tham gia nhiều dự án lớn và làm việc với cả chủ đầu tư tư nhân và khách hàng khu vực công. Phần lớn doanh thu đến từ các hợp đồng xây dựng.", "questions": ["What is the most important point about Giới thiệu một doanh nghiệp?", "Can you explain established in in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 4, "month": 1, "title": "Mô hình kinh doanh", "vocab": ["business model", "win contracts", "purchase materials", "suppliers", "project milestone", "project owner", "working capital", "cash-flow challenge", "operating cycle", "payment delay"], "structures": ["The company's business model is...", "It wins... and then...", "The main challenge is that...", "Therefore, ... plays an important role."], "english": "The company's business model is relatively straightforward. It wins construction contracts, purchases materials and services from suppliers, completes the work according to project milestones, and receives payment from the project owner. The main challenge is that the company often needs to pay suppliers and workers before receiving payment from the investor. Therefore, working-capital financing plays an important role.", "vietnamese": "Mô hình kinh doanh của công ty khá đơn giản. Công ty trúng các hợp đồng xây dựng, mua vật tư và dịch vụ từ nhà cung cấp, hoàn thành công việc theo các mốc tiến độ và nhận thanh toán từ chủ đầu tư. Thách thức chính là công ty thường phải trả tiền cho nhà cung cấp và người lao động trước khi nhận được tiền từ chủ đầu tư. Vì vậy, tài trợ vốn lưu động đóng vai trò quan trọng.", "questions": ["What is the most important point about Mô hình kinh doanh?", "Can you explain business model in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 5, "month": 1, "title": "Nói về doanh thu", "vocab": ["record revenue of", "approximately", "increase by", "increase to", "compared with", "revenue growth", "be driven by", "fluctuate", "project progress", "contract award"], "structures": ["Revenue increased by + %", "Revenue increased to + số", "The growth was mainly driven by...", "X depends on..."], "english": "The company recorded revenue of approximately VND 800 billion last year. Revenue increased by around 15 percent compared with the previous year. The growth was mainly driven by several new construction contracts. However, revenue can fluctuate significantly from year to year because it depends on project progress and contract awards.", "vietnamese": "Công ty ghi nhận doanh thu khoảng 800 tỷ đồng trong năm trước. Doanh thu tăng khoảng 15% so với năm trước đó. Mức tăng chủ yếu đến từ một số hợp đồng xây dựng mới. Tuy nhiên, doanh thu có thể biến động đáng kể qua từng năm vì phụ thuộc vào tiến độ dự án và việc trúng thầu.", "questions": ["What is the most important point about Nói về doanh thu?", "Can you explain record revenue of in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 6, "month": 1, "title": "Nói về lợi nhuận", "vocab": ["gross profit", "net profit", "profit margin", "profitability", "material cost", "competition", "operating cash flow", "thin margin", "cost pressure", "earnings"], "structures": ["Although..., ... remained...", "This is common because...", "I would focus not only on... but also on..."], "english": "Although revenue increased, the company's profit margin remained relatively low. Net profit accounted for only around two percent of revenue. This is quite common in the construction industry because competition is high and material costs can change significantly. Therefore, when analyzing the company, I would focus not only on revenue growth but also on profitability and operating cash flow.", "vietnamese": "Mặc dù doanh thu tăng, biên lợi nhuận của công ty vẫn tương đối thấp. Lợi nhuận ròng chỉ chiếm khoảng 2% doanh thu. Điều này khá phổ biến trong ngành xây dựng vì mức độ cạnh tranh cao và chi phí vật liệu có thể biến động mạnh. Vì vậy, khi phân tích doanh nghiệp, tôi không chỉ xem tăng trưởng doanh thu mà còn chú ý đến khả năng sinh lời và dòng tiền hoạt động.", "questions": ["What is the most important point about Nói về lợi nhuận?", "Can you explain gross profit in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 7, "month": 1, "title": "Tổng hợp tuần 1", "vocab": ["strength", "weakness", "growth potential", "cash-flow pressure", "monitor closely", "project pipeline", "thin margin", "financeable", "risk factor", "stable growth"], "structures": ["Let me briefly introduce...", "Overall, I think...", "However, ... should be closely monitored."], "english": "Let me briefly introduce this customer. The company operates in the construction sector and has been in business for more than ten years. Its revenue has grown steadily, mainly due to new contracts. However, its profit margin remains relatively thin. The company also needs significant working capital because it often has to pay suppliers before receiving payment from project owners. Overall, I think the business has good growth potential, but cash flow should be closely monitored.", "vietnamese": "Tôi xin giới thiệu ngắn gọn về khách hàng này. Công ty hoạt động trong lĩnh vực xây dựng và đã hoạt động hơn mười năm. Doanh thu tăng trưởng ổn định, chủ yếu nhờ các hợp đồng mới. Tuy nhiên, biên lợi nhuận vẫn khá mỏng. Công ty cũng cần lượng vốn lưu động đáng kể vì thường phải thanh toán cho nhà cung cấp trước khi nhận được tiền từ chủ đầu tư. Nhìn chung, tôi cho rằng doanh nghiệp có tiềm năng tăng trưởng tốt nhưng cần theo dõi sát dòng tiền.", "questions": ["What is the most important point about Tổng hợp tuần 1?", "Can you explain strength in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 8, "month": 1, "title": "Các sản phẩm ngân hàng", "vocab": ["short-term loan", "overdraft facility", "bank guarantee", "bid bond", "performance guarantee", "advance payment guarantee", "factoring", "receivable", "reliable buyer", "transaction banking"], "structures": ["The customer currently uses...", "X is mainly used to...", "The customer may also use... if..."], "english": "The customer currently uses several banking products, including short-term loans, overdraft facilities and bank guarantees. Short-term loans are mainly used to finance working capital, while guarantees are required for bidding, contract performance and advance payments. The customer may also use factoring if it has confirmed receivables from reliable buyers.", "vietnamese": "Khách hàng hiện đang sử dụng một số sản phẩm ngân hàng, bao gồm vay ngắn hạn, hạn mức thấu chi và bảo lãnh ngân hàng. Vay ngắn hạn chủ yếu được dùng để tài trợ vốn lưu động, trong khi bảo lãnh được yêu cầu cho đấu thầu, thực hiện hợp đồng và thanh toán tạm ứng. Khách hàng cũng có thể sử dụng bao thanh toán nếu có các khoản phải thu được xác nhận từ những người mua đáng tin cậy.", "questions": ["What is the most important point about Các sản phẩm ngân hàng?", "Can you explain short-term loan in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 9, "month": 1, "title": "Credit Facility", "vocab": ["credit facility", "total limit", "working-capital loan", "guarantee line", "tenor", "annual review", "utilization", "financing need", "credit structure", "limit allocation"], "structures": ["The customer is requesting...", "The proposed facility includes...", "The facility will have...", "The exact utilization will depend on..."], "english": "The customer is requesting a total credit facility of VND 300 billion. The proposed facility includes VND 150 billion for working-capital loans and VND 150 billion for bank guarantees. The facility will have a twelve-month tenor and will be reviewed annually. The exact utilization will depend on the customer's project pipeline and financing needs.", "vietnamese": "Khách hàng đề nghị tổng hạn mức tín dụng 300 tỷ đồng. Hạn mức đề xuất gồm 150 tỷ đồng cho vay vốn lưu động và 150 tỷ đồng bảo lãnh ngân hàng. Hạn mức có thời hạn 12 tháng và được rà soát hàng năm. Mức sử dụng thực tế sẽ phụ thuộc vào danh mục dự án và nhu cầu tài trợ của khách hàng.", "questions": ["What is the most important point about Credit Facility?", "Can you explain credit facility in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 10, "month": 1, "title": "Mục đích vay", "vocab": ["finance working capital", "purchase materials", "pay subcontractors", "operating expenses", "project owner", "loan purpose", "business activities", "eligible expense", "funding need", "cost of execution"], "structures": ["The loan will mainly be used to...", "In particular, the customer needs funds to...", "The proposed loan purpose is consistent with..."], "english": "The loan will mainly be used to finance working capital. In particular, the customer needs funds to purchase construction materials, pay subcontractors and cover operating expenses before receiving payments from project owners. The proposed loan purpose is consistent with the company's normal business activities.", "vietnamese": "Khoản vay chủ yếu được dùng để tài trợ vốn lưu động. Cụ thể, khách hàng cần vốn để mua vật liệu xây dựng, thanh toán cho nhà thầu phụ và trang trải chi phí hoạt động trước khi nhận được tiền từ chủ đầu tư. Mục đích vay đề xuất phù hợp với hoạt động kinh doanh thông thường của công ty.", "questions": ["What is the most important point about Mục đích vay?", "Can you explain finance working capital in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 11, "month": 1, "title": "Dư nợ", "vocab": ["outstanding loan balance", "short-term debt", "annual revenue", "manageable", "borrowing", "payment delay", "leverage", "bank exposure", "utilization rate", "debt position"], "structures": ["The current outstanding balance is...", "Most of the debt is...", "Compared with..., ... is manageable", "We should monitor..."], "english": "The customer's current outstanding loan balance is approximately VND 180 billion. Most of the debt is short-term and used for working-capital financing. Compared with annual revenue, the debt level is still manageable, but we should monitor any significant increase in borrowing, especially if project payments are delayed.", "vietnamese": "Dư nợ hiện tại của khách hàng khoảng 180 tỷ đồng. Phần lớn là nợ ngắn hạn phục vụ vốn lưu động. So với doanh thu hàng năm, mức nợ này vẫn có thể kiểm soát, nhưng cần theo dõi mọi sự gia tăng đáng kể trong dư nợ, đặc biệt khi thanh toán từ dự án bị chậm.", "questions": ["What is the most important point about Dư nợ?", "Can you explain outstanding loan balance in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 12, "month": 1, "title": "Lãi suất", "vocab": ["lending rate", "market condition", "credit risk", "competitive rate", "pricing", "collateral", "transaction volume", "fee income", "overall relationship", "risk-based pricing"], "structures": ["The proposed lending rate should reflect...", "For a strong customer...", "Pricing should also take into account..."], "english": "The proposed lending rate should reflect both market conditions and the customer's credit risk. For a strong customer with stable cash flow, the bank may offer a more competitive rate. However, pricing should also take into account collateral, transaction volume, fee income and the overall relationship with the customer.", "vietnamese": "Lãi suất cho vay đề xuất cần phản ánh cả điều kiện thị trường và rủi ro tín dụng của khách hàng. Với khách hàng tốt có dòng tiền ổn định, ngân hàng có thể đưa ra mức lãi suất cạnh tranh hơn. Tuy nhiên, việc định giá cũng cần xem xét tài sản bảo đảm, quy mô giao dịch, thu nhập phí và tổng thể mối quan hệ với khách hàng.", "questions": ["What is the most important point about Lãi suất?", "Can you explain lending rate in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 13, "month": 1, "title": "Phí và tổng thu nhập", "vocab": ["fee income", "guarantee fee", "service fee", "lending margin", "total relationship", "cross-sell", "revenue stream", "banking income", "transaction fee", "profitability"], "structures": ["In addition to..., the bank can generate...", "X can be an important source of...", "Therefore, we should look at..."], "english": "In addition to interest income, the bank can generate fee income from guarantees and other services. For construction customers, guarantee fees can be an important source of revenue because they often require bid bonds, performance guarantees and advance-payment guarantees. Therefore, we should look at the total relationship rather than only the lending margin.", "vietnamese": "Ngoài thu nhập lãi, ngân hàng còn có thể tạo thu nhập phí từ bảo lãnh và các dịch vụ khác. Đối với khách hàng xây dựng, phí bảo lãnh có thể là nguồn thu quan trọng vì họ thường cần bảo lãnh dự thầu, bảo lãnh thực hiện hợp đồng và bảo lãnh tạm ứng. Vì vậy, cần nhìn vào tổng thể quan hệ thay vì chỉ xem biên lợi nhuận cho vay.", "questions": ["What is the most important point about Phí và tổng thu nhập?", "Can you explain fee income in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 14, "month": 1, "title": "Cấu trúc tín dụng", "vocab": ["combined facility", "working-capital financing", "guarantee line", "project execution", "contractual requirement", "project progress", "receivable quality", "financial position", "monitoring", "facility structure"], "structures": ["I would propose...", "This structure is suitable because...", "The facility should be reviewed based on..."], "english": "I would propose a combined facility that includes both working-capital financing and bank guarantees. This structure is suitable because the customer needs loans to fund project execution and guarantees to meet contractual requirements. The facility should be reviewed based on project progress, receivable quality and the customer's overall financial position.", "vietnamese": "Tôi đề xuất một hạn mức kết hợp gồm tài trợ vốn lưu động và bảo lãnh ngân hàng. Cấu trúc này phù hợp vì khách hàng cần khoản vay để thực hiện dự án và cần bảo lãnh để đáp ứng yêu cầu hợp đồng. Hạn mức nên được rà soát dựa trên tiến độ dự án, chất lượng khoản phải thu và tình hình tài chính tổng thể của khách hàng.", "questions": ["What is the most important point about Cấu trúc tín dụng?", "Can you explain combined facility in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 15, "month": 1, "title": "Nhu cầu khách hàng", "vocab": ["additional financing", "win contracts", "working-capital requirement", "materials", "labor", "subcontractor", "six-month outlook", "expansion", "funding gap", "expected increase"], "structures": ["The customer is seeking... because...", "As a result, ... is expected to increase..."], "english": "The customer is seeking additional financing because it has recently won several new contracts. These projects will require higher spending on materials, labor and subcontractors. As a result, the company's working-capital requirement is expected to increase over the next six months.", "vietnamese": "Khách hàng đang cần thêm vốn vì gần đây đã trúng một số hợp đồng mới. Các dự án này sẽ làm tăng chi phí cho vật liệu, nhân công và nhà thầu phụ. Do đó, nhu cầu vốn lưu động của công ty dự kiến sẽ tăng trong sáu tháng tới.", "questions": ["What is the most important point about Nhu cầu khách hàng?", "Can you explain additional financing in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 16, "month": 1, "title": "Đề nghị cấp tín dụng", "vocab": ["submit a request", "additional credit limit", "financial statements", "project contracts", "cash-flow projection", "existing debt", "review documents", "credit application", "supporting document", "recommendation"], "structures": ["The customer has submitted...", "The application includes...", "We need to review... before..."], "english": "The customer has submitted a request for an additional credit limit. The application includes financial statements, project contracts, cash-flow projections and information on existing debt. We need to review these documents carefully before making a recommendation.", "vietnamese": "Khách hàng đã nộp đề nghị tăng hạn mức tín dụng. Hồ sơ bao gồm báo cáo tài chính, hợp đồng dự án, dự báo dòng tiền và thông tin về dư nợ hiện tại. Chúng ta cần xem xét kỹ các tài liệu này trước khi đưa ra khuyến nghị.", "questions": ["What is the most important point about Đề nghị cấp tín dụng?", "Can you explain submit a request in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 17, "month": 1, "title": "Phê duyệt có điều kiện", "vocab": ["approve", "subject to", "condition", "updated financial information", "eligible project expense", "monitor receivables", "credit condition", "covenant", "approval authority", "risk control"], "structures": ["The proposal can be approved subject to...", "First... Second... Third..."], "english": "The credit proposal can be approved subject to several conditions. First, the customer must provide updated financial information. Second, loan disbursement should be linked to eligible project expenses. Third, the bank should monitor receivables from major project owners.", "vietnamese": "Đề xuất tín dụng có thể được phê duyệt kèm một số điều kiện. Thứ nhất, khách hàng phải cung cấp thông tin tài chính cập nhật. Thứ hai, giải ngân phải gắn với các chi phí dự án hợp lệ. Thứ ba, ngân hàng cần giám sát các khoản phải thu từ các chủ đầu tư lớn.", "questions": ["What is the most important point about Phê duyệt có điều kiện?", "Can you explain approve in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 18, "month": 1, "title": "Giải ngân", "vocab": ["disbursement", "conditions precedent", "supporting documents", "invoice", "payment request", "own capital", "verify", "proper use of funds", "eligible expense", "drawdown"], "structures": ["Before disbursement...", "The bank should verify that...", "Supporting documents may include...", "The purpose is to ensure..."], "english": "Before disbursement, the bank should verify that all required conditions have been satisfied. Supporting documents may include contracts, invoices, payment requests and evidence of the customer's own capital contribution. The purpose is to ensure that the loan is used properly.", "vietnamese": "Trước khi giải ngân, ngân hàng cần xác minh rằng tất cả các điều kiện yêu cầu đã được đáp ứng. Hồ sơ hỗ trợ có thể gồm hợp đồng, hóa đơn, đề nghị thanh toán và bằng chứng về phần vốn tự có của khách hàng. Mục đích là đảm bảo khoản vay được sử dụng đúng mục đích.", "questions": ["What is the most important point about Giải ngân?", "Can you explain disbursement in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 19, "month": 1, "title": "Trả nợ", "vocab": ["source of repayment", "project owner", "repayment schedule", "payment schedule", "construction contract", "repayment capacity", "cash collection", "debt service", "delayed payment", "alignment"], "structures": ["The main source of repayment will be...", "The repayment schedule should be aligned with...", "If..., ... may be affected."], "english": "The main source of repayment will be cash collected from project owners. Therefore, the repayment schedule should be aligned with the expected payment schedule under the construction contracts. If project payments are delayed, the customer's repayment capacity may also be affected.", "vietnamese": "Nguồn trả nợ chính sẽ là dòng tiền thu từ chủ đầu tư. Vì vậy, lịch trả nợ cần phù hợp với lịch thanh toán dự kiến theo các hợp đồng xây dựng. Nếu thanh toán dự án bị chậm, khả năng trả nợ của khách hàng cũng có thể bị ảnh hưởng.", "questions": ["What is the most important point about Trả nợ?", "Can you explain source of repayment in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 20, "month": 1, "title": "Đáo hạn và tái cấp", "vocab": ["mature", "renewal", "reassess", "financial position", "project pipeline", "repayment history", "overall credit risk", "credit limit", "annual review", "automatic renewal"], "structures": ["The facility will mature in...", "Before renewal, the bank should reassess...", "The credit limit should not be automatically renewed..."], "english": "The facility will mature in twelve months. Before renewal, the bank should reassess the customer's financial position, project pipeline, repayment history and overall credit risk. The credit limit should not be automatically renewed without a proper review.", "vietnamese": "Hạn mức sẽ đáo hạn sau 12 tháng. Trước khi tái cấp, ngân hàng cần đánh giá lại tình hình tài chính, danh mục dự án, lịch sử trả nợ và rủi ro tín dụng tổng thể của khách hàng. Hạn mức không nên tự động gia hạn nếu chưa có rà soát đầy đủ.", "questions": ["What is the most important point about Đáo hạn và tái cấp?", "Can you explain mature in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 21, "month": 1, "title": "Mô phỏng trình tín dụng", "vocab": ["credit committee", "reasonable financing need", "supported by contracts", "monitor receivables", "project execution", "approval", "appropriate control", "recommendation", "presentation", "rationale"], "structures": ["If I were presenting this case...", "I would say that...", "However...", "I would recommend..."], "english": "If I were presenting this case to the credit committee, I would say that the customer has a reasonable financing need supported by new contracts. However, the bank should closely monitor receivables and project execution. I would recommend approval with appropriate controls.", "vietnamese": "Nếu trình bày hồ sơ này trước hội đồng tín dụng, tôi sẽ nói rằng khách hàng có nhu cầu tài trợ hợp lý được hỗ trợ bởi các hợp đồng mới. Tuy nhiên, ngân hàng cần theo dõi sát khoản phải thu và việc thực hiện dự án. Tôi sẽ đề xuất phê duyệt kèm các biện pháp kiểm soát phù hợp.", "questions": ["What is the most important point about Mô phỏng trình tín dụng?", "Can you explain credit committee in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 22, "month": 1, "title": "Tài sản bảo đảm", "vocab": ["collateral", "mortgage", "pledge", "receivable", "legal validity", "market value", "basis for lending", "repayment capacity", "security package", "valuation"], "structures": ["The facility is partially secured by...", "The bank should assess both... and...", "However, collateral should not be..."], "english": "The proposed facility is partially secured by real estate and receivables. The bank should assess both the legal validity and the market value of the collateral. However, collateral should not be the only basis for lending. The customer's cash flow and repayment capacity remain the most important factors.", "vietnamese": "Hạn mức đề xuất được bảo đảm một phần bằng bất động sản và các khoản phải thu. Ngân hàng cần đánh giá cả tính pháp lý và giá trị thị trường của tài sản bảo đảm. Tuy nhiên, tài sản bảo đảm không nên là cơ sở duy nhất cho quyết định cho vay. Dòng tiền và khả năng trả nợ của khách hàng vẫn là yếu tố quan trọng nhất.", "questions": ["What is the most important point about Tài sản bảo đảm?", "Can you explain collateral in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 23, "month": 1, "title": "Bảo lãnh ngân hàng", "vocab": ["bank guarantee", "commitment", "beneficiary", "applicant", "guarantor", "bid bond", "performance guarantee", "advance-payment guarantee", "warranty guarantee", "obligation"], "structures": ["A bank guarantee is a commitment...", "If the customer fails to...", "Common types include..."], "english": "A bank guarantee is a commitment made by the bank to pay the beneficiary if the customer fails to perform its obligations. In construction, common types of guarantees include bid bonds, performance guarantees, advance-payment guarantees and warranty guarantees.", "vietnamese": "Bảo lãnh ngân hàng là cam kết của ngân hàng thanh toán cho bên thụ hưởng nếu khách hàng không thực hiện nghĩa vụ. Trong xây dựng, các loại bảo lãnh phổ biến gồm bảo lãnh dự thầu, bảo lãnh thực hiện hợp đồng, bảo lãnh tạm ứng và bảo lãnh bảo hành.", "questions": ["What is the most important point about Bảo lãnh ngân hàng?", "Can you explain bank guarantee in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 24, "month": 1, "title": "Bao thanh toán", "vocab": ["factoring", "accounts receivable", "seller", "buyer", "debtor", "transfer receivables", "working capital", "payment terms", "buyer quality", "early cash"], "structures": ["Factoring allows... to...", "This can help...", "The quality of the buyer is..."], "english": "Factoring allows a company to receive cash earlier by transferring its receivables to a financial institution. This can help improve working capital and reduce the pressure caused by long payment terms. The quality of the buyer is an important factor in assessing factoring transactions.", "vietnamese": "Bao thanh toán cho phép doanh nghiệp nhận tiền sớm hơn bằng cách chuyển nhượng các khoản phải thu cho tổ chức tài chính. Điều này giúp cải thiện vốn lưu động và giảm áp lực do thời hạn thanh toán dài. Chất lượng của người mua là yếu tố quan trọng khi đánh giá giao dịch bao thanh toán.", "questions": ["What is the most important point about Bao thanh toán?", "Can you explain factoring in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 25, "month": 1, "title": "Dòng tiền", "vocab": ["cash flow", "accounting profit", "liquidity", "receivable collection", "operating cash flow", "repayment capacity", "cash generation", "liquidity pressure", "collection period", "cash position"], "structures": ["When assessing a borrower...", "A company may... but still...", "Therefore, ... is an important indicator..."], "english": "When assessing a borrower, I pay close attention to cash flow. A company may report accounting profits but still face liquidity problems if receivables are collected slowly. Therefore, positive operating cash flow is an important indicator of repayment capacity.", "vietnamese": "Khi đánh giá khách hàng vay, tôi đặc biệt chú ý đến dòng tiền. Một doanh nghiệp có thể báo cáo lợi nhuận kế toán nhưng vẫn gặp vấn đề thanh khoản nếu khoản phải thu thu hồi chậm. Vì vậy, dòng tiền hoạt động dương là chỉ báo quan trọng về khả năng trả nợ.", "questions": ["What is the most important point about Dòng tiền?", "Can you explain cash flow in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 26, "month": 1, "title": "Vốn lưu động", "vocab": ["working capital", "materials", "labor", "subcontractor", "receivables", "inventory", "borrowing", "operating cycle", "funding requirement", "liquidity"], "structures": ["Construction companies usually have... because...", "If... increase too quickly..., the company may..."], "english": "Construction companies usually have high working-capital needs because they must finance materials, labor and subcontractors during project execution. If receivables increase too quickly or inventory remains high, the company may need additional borrowing.", "vietnamese": "Doanh nghiệp xây dựng thường có nhu cầu vốn lưu động cao vì phải tài trợ vật liệu, nhân công và nhà thầu phụ trong quá trình thực hiện dự án. Nếu khoản phải thu tăng quá nhanh hoặc tồn kho duy trì ở mức cao, doanh nghiệp có thể cần vay thêm.", "questions": ["What is the most important point about Vốn lưu động?", "Can you explain working capital in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 27, "month": 1, "title": "Rủi ro tín dụng", "vocab": ["credit risk", "delayed payment", "high leverage", "low profit margin", "concentration risk", "liquidity", "repayment ability", "default risk", "risk factor", "exposure"], "structures": ["The main credit risks are...", "These risks could affect..."], "english": "The main credit risks in this case are delayed payments, high leverage, low profit margins and concentration in a small number of projects. These risks could affect the company's liquidity and ability to repay debt.", "vietnamese": "Các rủi ro tín dụng chính trong trường hợp này là thanh toán chậm, đòn bẩy cao, biên lợi nhuận thấp và tập trung vào một số ít dự án. Những rủi ro này có thể ảnh hưởng đến thanh khoản và khả năng trả nợ của doanh nghiệp.", "questions": ["What is the most important point about Rủi ro tín dụng?", "Can you explain credit risk in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 28, "month": 1, "title": "Biện pháp giảm thiểu rủi ro", "vocab": ["risk mitigation", "control disbursement", "monitor receivables", "project progress", "acceptable debt level", "covenant", "periodic review", "risk control", "condition", "monitoring"], "structures": ["I would recommend approving... but with...", "The bank should..."], "english": "I would recommend approving the facility, but with several risk-mitigation measures. The bank should control disbursement, monitor major receivables, review project progress regularly and require the customer to maintain an acceptable debt level.", "vietnamese": "Tôi đề xuất phê duyệt hạn mức nhưng kèm một số biện pháp giảm thiểu rủi ro. Ngân hàng nên kiểm soát giải ngân, giám sát các khoản phải thu lớn, rà soát tiến độ dự án thường xuyên và yêu cầu khách hàng duy trì mức nợ chấp nhận được.", "questions": ["What is the most important point about Biện pháp giảm thiểu rủi ro?", "Can you explain risk mitigation in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 29, "month": 1, "title": "Trình bày khách hàng", "vocab": ["present a customer", "apply for", "project pipeline", "revenue growth", "thin margin", "delayed collection", "financeable", "appropriate controls", "credit case", "conclusion"], "structures": ["Today I would like to present...", "The company has...", "The main risk is...", "Overall, I believe..."], "english": "Today I would like to present a construction customer applying for a VND 300 billion credit facility. The company has good experience and a stable project pipeline. Revenue is growing, but profit margins remain thin. The main risk is delayed collection from project owners. Overall, I believe the customer is financeable if the bank applies appropriate controls.", "vietnamese": "Hôm nay tôi xin trình bày về một khách hàng xây dựng đang đề nghị hạn mức tín dụng 300 tỷ đồng. Công ty có kinh nghiệm tốt và danh mục dự án ổn định. Doanh thu đang tăng nhưng biên lợi nhuận vẫn mỏng. Rủi ro chính là việc thu tiền từ chủ đầu tư bị chậm. Nhìn chung, tôi cho rằng khách hàng có thể được tài trợ nếu ngân hàng áp dụng các biện pháp kiểm soát phù hợp.", "questions": ["What is the most important point about Trình bày khách hàng?", "Can you explain present a customer in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 30, "month": 1, "title": "Tổng kết tháng 1", "vocab": ["introduce a company", "business model", "financial performance", "credit proposal", "working capital", "collateral", "cash flow", "credit risk", "improvement goal", "confidence"], "structures": ["Over the past month...", "I can now...", "My next goal is to..."], "english": "Over the past month, I have learned how to introduce a company, explain its business model, describe its financial performance and present a credit proposal. I can now talk about loans, guarantees, factoring, working capital, collateral, cash flow and credit risk. My next goal is to improve my ability to analyze financial statements and discuss risks more naturally in English.", "vietnamese": "Trong tháng vừa qua, tôi đã học cách giới thiệu doanh nghiệp, giải thích mô hình kinh doanh, mô tả tình hình tài chính và trình bày đề xuất tín dụng. Tôi hiện có thể nói về khoản vay, bảo lãnh, bao thanh toán, vốn lưu động, tài sản bảo đảm, dòng tiền và rủi ro tín dụng. Mục tiêu tiếp theo là cải thiện khả năng phân tích báo cáo tài chính và trao đổi về rủi ro tự nhiên hơn bằng tiếng Anh.", "questions": ["What is the most important point about Tổng kết tháng 1?", "Can you explain introduce a company in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 31, "month": 2, "title": "Balance Sheet", "vocab": ["assets", "liabilities", "equity", "total assets", "net worth", "current assets", "non-current assets", "financial position"], "structures": ["As of + date, total assets stood at...", "X accounted for ...% of total assets", "The company is funded mainly by..."], "english": "As of the latest reporting date, the company had total assets of approximately VND 1,200 billion. Current assets accounted for a large share of total assets, mainly due to receivables and work in progress. The company was funded by both bank borrowing and shareholder equity. I would pay close attention to receivable quality, short-term debt and the equity base.", "vietnamese": "Tại thời điểm báo cáo gần nhất, công ty có tổng tài sản khoảng 1.200 tỷ đồng. Tài sản ngắn hạn chiếm tỷ trọng lớn, chủ yếu do khoản phải thu và chi phí dở dang. Công ty được tài trợ bởi cả vốn vay ngân hàng và vốn chủ sở hữu. Tôi đặc biệt chú ý đến chất lượng khoản phải thu, nợ ngắn hạn và nền vốn chủ sở hữu.", "questions": ["What is the most important point about Balance Sheet?", "Can you explain assets in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 32, "month": 2, "title": "Current Assets", "vocab": ["cash", "receivables", "inventory", "prepayments", "current asset", "liquidity", "collection", "turnover"], "structures": ["Current assets mainly consist of...", "X increased due to...", "The high level of... may indicate..."], "english": "The company's current assets mainly consist of cash, trade receivables and inventory. Receivables have increased significantly because several project owners have not yet made payment. This may create liquidity pressure even though reported revenue remains strong. I would review the aging of receivables and identify any overdue amounts.", "vietnamese": "Tài sản ngắn hạn của công ty chủ yếu gồm tiền, khoản phải thu thương mại và hàng tồn kho. Khoản phải thu tăng đáng kể vì một số chủ đầu tư chưa thanh toán. Điều này có thể tạo áp lực thanh khoản dù doanh thu vẫn cao. Tôi sẽ rà soát tuổi nợ và xác định các khoản quá hạn.", "questions": ["What is the most important point about Current Assets?", "Can you explain cash in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 33, "month": 2, "title": "Current Liabilities", "vocab": ["payables", "short-term borrowing", "accrued expense", "current liability", "supplier debt", "bank debt", "maturity"], "structures": ["Current liabilities are mainly made up of...", "Short-term debt increased by...", "This may put pressure on..."], "english": "Current liabilities are mainly made up of short-term bank loans, trade payables and accrued expenses. Short-term borrowing increased during the year to support project execution. While this is understandable, a rapid increase in short-term debt may put pressure on liquidity if collections are delayed.", "vietnamese": "Nợ ngắn hạn chủ yếu gồm vay ngân hàng ngắn hạn, phải trả nhà cung cấp và chi phí phải trả. Vay ngắn hạn tăng để phục vụ thực hiện dự án. Tuy nhiên, nếu nợ ngắn hạn tăng nhanh, áp lực thanh khoản có thể tăng khi việc thu tiền bị chậm.", "questions": ["What is the most important point about Current Liabilities?", "Can you explain payables in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 34, "month": 2, "title": "Income Statement", "vocab": ["revenue", "cost of goods sold", "gross profit", "operating expense", "EBIT", "net profit", "income statement", "earnings"], "structures": ["Revenue reached... while net profit was...", "Costs increased faster than revenue", "As a result..."], "english": "The company reported strong revenue growth during the year, but operating expenses also increased. As a result, net profit improved only slightly. When analyzing the income statement, I would compare revenue growth with cost growth and assess whether the company can maintain a reasonable profit margin.", "vietnamese": "Công ty ghi nhận tăng trưởng doanh thu tốt nhưng chi phí hoạt động cũng tăng. Vì vậy, lợi nhuận ròng chỉ cải thiện nhẹ. Khi phân tích báo cáo kết quả kinh doanh, tôi sẽ so sánh tốc độ tăng doanh thu với tăng chi phí và đánh giá khả năng duy trì biên lợi nhuận hợp lý.", "questions": ["What is the most important point about Income Statement?", "Can you explain revenue in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 35, "month": 2, "title": "Profitability", "vocab": ["gross margin", "operating margin", "net margin", "return", "profitability", "earnings", "cost pressure", "pricing power"], "structures": ["The net margin stood at...", "Profitability improved/deteriorated because...", "Compared with last year..."], "english": "The company's net profit margin remains relatively low at around two percent. Profitability is affected by strong competition and fluctuations in construction material prices. I would compare margins with previous years and with similar companies to determine whether the current level is sustainable.", "vietnamese": "Biên lợi nhuận ròng của công ty vẫn khá thấp, khoảng 2%. Khả năng sinh lời bị ảnh hưởng bởi cạnh tranh cao và biến động giá vật liệu xây dựng. Tôi sẽ so sánh biên lợi nhuận với các năm trước và doanh nghiệp tương đồng để đánh giá tính bền vững.", "questions": ["What is the most important point about Profitability?", "Can you explain gross margin in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 36, "month": 2, "title": "Cash Flow Statement", "vocab": ["operating cash flow", "investing cash flow", "financing cash flow", "cash inflow", "cash outflow", "free cash flow"], "structures": ["Operating cash flow was positive/negative at...", "The main driver was...", "This suggests that..."], "english": "Operating cash flow was negative despite positive net profit. The main reason was a significant increase in receivables. This difference is important because accounting profit does not always mean that the company is generating enough cash. I would monitor cash conversion closely.", "vietnamese": "Dòng tiền hoạt động âm mặc dù lợi nhuận ròng dương. Nguyên nhân chính là các khoản phải thu tăng mạnh. Sự khác biệt này quan trọng vì lợi nhuận kế toán không có nghĩa doanh nghiệp tạo đủ tiền mặt. Tôi sẽ theo dõi khả năng chuyển đổi lợi nhuận thành tiền.", "questions": ["What is the most important point about Cash Flow Statement?", "Can you explain operating cash flow in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 37, "month": 2, "title": "Ôn tập BCTC", "vocab": ["financial statement", "balance sheet", "income statement", "cash flow statement", "asset", "liability", "equity", "revenue", "profit", "cash flow"], "structures": ["The company's financial position can be summarized as follows...", "The key point is...", "Overall..."], "english": "The company's financial position can be summarized in three points. First, revenue is growing. Second, profitability remains thin. Third, operating cash flow is under pressure because receivables are rising. Overall, the company is growing, but liquidity and debt levels require close monitoring.", "vietnamese": "Tình hình tài chính của công ty có thể tóm tắt trong ba điểm. Thứ nhất, doanh thu tăng. Thứ hai, biên lợi nhuận vẫn mỏng. Thứ ba, dòng tiền hoạt động chịu áp lực do khoản phải thu tăng. Nhìn chung, công ty tăng trưởng nhưng thanh khoản và mức nợ cần được theo dõi sát.", "questions": ["What is the most important point about Ôn tập BCTC?", "Can you explain financial statement in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 38, "month": 2, "title": "Revenue Growth", "vocab": ["year-on-year", "increase by", "decrease by", "remain stable", "revenue growth", "contraction", "recovery", "growth rate"], "structures": ["Revenue increased by... compared with...", "Growth was mainly driven by...", "Revenue remained broadly stable..."], "english": "Revenue increased by 18 percent compared with the previous year. The growth was mainly driven by new infrastructure contracts. However, I would also check whether the increase in revenue translated into stronger cash flow and profit, because rapid growth can create additional working-capital pressure.", "vietnamese": "Doanh thu tăng 18% so với năm trước, chủ yếu nhờ các hợp đồng hạ tầng mới. Tuy nhiên, tôi cũng sẽ kiểm tra xem tăng trưởng doanh thu có chuyển thành dòng tiền và lợi nhuận tốt hơn hay không, vì tăng trưởng nhanh có thể làm tăng áp lực vốn lưu động.", "questions": ["What is the most important point about Revenue Growth?", "Can you explain year-on-year in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 39, "month": 2, "title": "Profit Trend", "vocab": ["improve", "deteriorate", "recover", "decline", "remain flat", "earnings", "net profit", "bottom line", "profitability"], "structures": ["Net profit improved from... to...", "Profit declined despite revenue growth because...", "Earnings recovered in..."], "english": "Net profit improved slightly from the previous year, but the increase was much slower than revenue growth. This suggests that cost pressure remains high. I would analyze material costs, subcontractor expenses and financing costs to understand the main reasons for the weak improvement in profit.", "vietnamese": "Lợi nhuận ròng tăng nhẹ so với năm trước nhưng chậm hơn nhiều so với tốc độ tăng doanh thu. Điều này cho thấy áp lực chi phí vẫn cao. Tôi sẽ phân tích chi phí vật liệu, nhà thầu phụ và chi phí tài chính để hiểu nguyên nhân.", "questions": ["What is the most important point about Profit Trend?", "Can you explain improve in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 40, "month": 2, "title": "Margin Analysis", "vocab": ["margin expansion", "margin compression", "gross margin", "net margin", "cost structure", "pricing", "input cost", "efficiency"], "structures": ["The margin expanded from... to...", "The decline was mainly due to...", "This indicates..."], "english": "The company's gross margin declined from eight percent to six percent. The decrease was mainly due to higher material and subcontracting costs. A lower margin reduces the company's ability to absorb unexpected cost increases, so I would consider this an important risk factor.", "vietnamese": "Biên lợi nhuận gộp giảm từ 8% xuống 6%, chủ yếu do chi phí vật liệu và nhà thầu phụ tăng. Biên lợi nhuận thấp làm giảm khả năng hấp thụ các biến động chi phí ngoài dự kiến, vì vậy đây là một yếu tố rủi ro quan trọng.", "questions": ["What is the most important point about Margin Analysis?", "Can you explain margin expansion in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 41, "month": 2, "title": "Liquidity", "vocab": ["current ratio", "quick ratio", "liquid asset", "short-term obligation", "liquidity buffer", "cash balance", "liquidity risk"], "structures": ["The current ratio stood at...", "Liquidity appears adequate/weak because...", "The company may face..."], "english": "The company's current ratio is above one, but liquidity is still not particularly strong because a large portion of current assets consists of receivables. If collections are delayed, the company may face difficulty meeting short-term obligations.", "vietnamese": "Hệ số thanh toán hiện hành trên 1 nhưng thanh khoản vẫn chưa thực sự mạnh vì tỷ trọng lớn tài sản ngắn hạn là khoản phải thu. Nếu thu tiền chậm, công ty có thể gặp khó khăn khi thanh toán nghĩa vụ ngắn hạn.", "questions": ["What is the most important point about Liquidity?", "Can you explain current ratio in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 42, "month": 2, "title": "Leverage", "vocab": ["debt-to-equity", "leverage", "borrowing", "capital structure", "gearing", "debt level", "equity base", "indebtedness"], "structures": ["Debt-to-equity increased to...", "The company is relatively highly leveraged", "This limits..."], "english": "The company's debt-to-equity ratio has increased significantly. This means the business is relying more heavily on borrowed funds to support growth. Higher leverage increases repayment pressure and vulnerability during a downturn.", "vietnamese": "Tỷ lệ nợ trên vốn chủ sở hữu tăng đáng kể, nghĩa là doanh nghiệp đang phụ thuộc nhiều hơn vào vốn vay để tăng trưởng. Đòn bẩy cao làm tăng áp lực trả nợ và mức độ dễ tổn thương khi thị trường xấu đi.", "questions": ["What is the most important point about Leverage?", "Can you explain debt-to-equity in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 43, "month": 2, "title": "Debt Burden", "vocab": ["debt burden", "heavily leveraged", "repayment pressure", "borrowing cost", "debt service", "maturity profile", "refinancing risk"], "structures": ["The current debt burden is...", "Debt service may become difficult if...", "Refinancing risk should be monitored..."], "english": "The company has a relatively high debt burden, with most borrowings maturing within twelve months. This creates refinancing risk. If banks reduce limits or project payments are delayed, the company may have difficulty repaying or refinancing its debt.", "vietnamese": "Công ty có gánh nặng nợ tương đối cao và phần lớn khoản vay đáo hạn trong 12 tháng. Điều này tạo rủi ro tái cấp vốn. Nếu ngân hàng giảm hạn mức hoặc dự án thanh toán chậm, công ty có thể gặp khó khăn trong việc trả hoặc tái cấp nợ.", "questions": ["What is the most important point about Debt Burden?", "Can you explain debt burden in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 44, "month": 2, "title": "Ôn tập chỉ số", "vocab": ["ratio", "trend", "benchmark", "compare", "interpret", "financial indicator", "risk signal", "peer comparison"], "structures": ["I would focus on three indicators...", "The most concerning ratio is... because..."], "english": "When reviewing financial ratios, I would focus on liquidity, leverage, profitability and cash flow. No single ratio should be analyzed in isolation. The most useful approach is to compare the current year with historical performance, peer companies and the business model.", "vietnamese": "Khi xem các chỉ số tài chính, tôi tập trung vào thanh khoản, đòn bẩy, khả năng sinh lời và dòng tiền. Không nên phân tích bất kỳ chỉ số nào riêng lẻ. Cách hữu ích là so sánh với lịch sử, doanh nghiệp cùng ngành và mô hình kinh doanh.", "questions": ["What is the most important point about Ôn tập chỉ số?", "Can you explain ratio in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 45, "month": 2, "title": "Receivables", "vocab": ["accounts receivable", "receivable days", "overdue receivable", "collection period", "aging", "bad debt", "collection risk"], "structures": ["Receivable days increased to...", "A large portion of receivables is from...", "Delayed collection may..."], "english": "Receivable days have increased significantly, which means customers are taking longer to pay. A large portion of receivables is concentrated in several project owners. I would review the aging schedule, payment history and any disputes before relying on these receivables as a repayment source.", "vietnamese": "Số ngày phải thu tăng đáng kể, nghĩa là khách hàng đang thanh toán chậm hơn. Một tỷ trọng lớn khoản phải thu tập trung ở một số chủ đầu tư. Tôi sẽ rà soát tuổi nợ, lịch sử thanh toán và tranh chấp trước khi coi đây là nguồn trả nợ.", "questions": ["What is the most important point about Receivables?", "Can you explain accounts receivable in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 46, "month": 2, "title": "Inventory", "vocab": ["inventory turnover", "slow-moving inventory", "raw materials", "work in progress", "stock level", "inventory days", "obsolete stock"], "structures": ["Inventory increased by...", "Inventory days remain high", "This may indicate..."], "english": "Inventory remains high because the company holds materials and work in progress for several ongoing projects. High inventory is not always negative in construction, but I would check whether the stock is linked to active contracts and whether any amount is slow-moving or obsolete.", "vietnamese": "Tồn kho duy trì ở mức cao vì công ty đang nắm vật liệu và chi phí dở dang cho nhiều dự án. Tồn kho cao không phải lúc nào cũng xấu trong xây dựng, nhưng tôi sẽ kiểm tra chúng có gắn với hợp đồng đang thực hiện và có khoản nào chậm luân chuyển hay lỗi thời không.", "questions": ["What is the most important point about Inventory?", "Can you explain inventory turnover in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 47, "month": 2, "title": "Payables", "vocab": ["accounts payable", "payable days", "supplier credit", "trade payable", "payment term", "overdue payable", "supplier dependence"], "structures": ["Payable days increased/decreased...", "Supplier credit provides...", "However..."], "english": "The company uses supplier credit as an important source of working-capital funding. Payable days have increased, which helps liquidity in the short term. However, excessive delays in paying suppliers may damage relationships or indicate underlying cash-flow stress.", "vietnamese": "Công ty sử dụng tín dụng nhà cung cấp như một nguồn vốn lưu động quan trọng. Số ngày phải trả tăng giúp thanh khoản ngắn hạn. Tuy nhiên, chậm trả quá mức có thể ảnh hưởng quan hệ nhà cung cấp hoặc phản ánh áp lực dòng tiền.", "questions": ["What is the most important point about Payables?", "Can you explain accounts payable in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 48, "month": 2, "title": "Working Capital Cycle", "vocab": ["working capital cycle", "receivable days", "inventory days", "payable days", "operating cycle", "funding gap", "cash tied up"], "structures": ["The working-capital cycle lengthened because...", "This increased the funding gap", "The company may need..."], "english": "The working-capital cycle has lengthened because receivables are collected more slowly while project execution continues. This increases the funding gap between cash outflows and cash inflows. As a result, the company may need more short-term financing.", "vietnamese": "Chu kỳ vốn lưu động kéo dài do khoản phải thu thu chậm trong khi dự án vẫn tiếp tục thực hiện. Điều này làm tăng khoảng trống giữa dòng tiền ra và dòng tiền vào. Vì vậy, công ty có thể cần thêm vốn ngắn hạn.", "questions": ["What is the most important point about Working Capital Cycle?", "Can you explain working capital cycle in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 49, "month": 2, "title": "Cash Conversion Cycle", "vocab": ["cash conversion cycle", "DSO", "DIO", "DPO", "conversion period", "operating efficiency", "collection", "payment"], "structures": ["The cash conversion cycle is calculated as...", "A longer cycle means...", "The bank should monitor..."], "english": "The cash conversion cycle measures how long cash is tied up in operations. A longer cycle means the company needs more working capital. For a construction company, I would pay particular attention to receivable days and payment terms with project owners.", "vietnamese": "Chu kỳ chuyển đổi tiền mặt đo thời gian tiền bị giữ trong hoạt động kinh doanh. Chu kỳ càng dài thì doanh nghiệp càng cần nhiều vốn lưu động. Với doanh nghiệp xây dựng, tôi đặc biệt quan tâm số ngày phải thu và điều khoản thanh toán của chủ đầu tư.", "questions": ["What is the most important point about Cash Conversion Cycle?", "Can you explain cash conversion cycle in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 50, "month": 2, "title": "Operating Cash Flow", "vocab": ["positive operating cash flow", "negative CFO", "cash generation", "working capital movement", "quality of earnings"], "structures": ["Despite positive accounting profit, operating cash flow was...", "The gap was mainly due to...", "This raises concern about..."], "english": "The company reported positive net profit but negative operating cash flow. The main reason was the increase in receivables and work in progress. This raises concern about the quality of earnings and the company's ability to convert accounting profit into cash.", "vietnamese": "Công ty có lợi nhuận ròng dương nhưng dòng tiền hoạt động âm. Nguyên nhân chính là tăng khoản phải thu và chi phí dở dang. Điều này đặt ra vấn đề về chất lượng lợi nhuận và khả năng chuyển lợi nhuận kế toán thành tiền mặt.", "questions": ["What is the most important point about Operating Cash Flow?", "Can you explain positive operating cash flow in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 51, "month": 2, "title": "Ôn tập vốn lưu động", "vocab": ["working capital", "receivable", "inventory", "payable", "cash conversion", "liquidity", "short-term funding", "operating cycle"], "structures": ["The main working-capital issue is...", "I would monitor...", "The financing need is driven by..."], "english": "The main working-capital issue is delayed collection from project owners. Receivables are growing faster than revenue, and the company is using more short-term debt to fund the gap. I would monitor collection performance and project cash flow closely.", "vietnamese": "Vấn đề vốn lưu động chính là việc thu tiền từ chủ đầu tư bị chậm. Khoản phải thu tăng nhanh hơn doanh thu và công ty đang dùng thêm nợ ngắn hạn để bù đắp khoảng trống. Tôi sẽ theo dõi sát việc thu tiền và dòng tiền từng dự án.", "questions": ["What is the most important point about Ôn tập vốn lưu động?", "Can you explain working capital in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 52, "month": 2, "title": "Debt Service", "vocab": ["debt service", "principal", "interest", "repayment capacity", "scheduled payment", "cash available", "debt obligation"], "structures": ["The main source of debt service is...", "Scheduled repayments are...", "The company has sufficient/limited capacity..."], "english": "The main source of debt service is cash collected from completed project milestones. Based on current projections, the company can meet scheduled principal and interest payments. However, repayment capacity could weaken if major customers delay payment.", "vietnamese": "Nguồn trả nợ chính là tiền thu từ các mốc hoàn thành dự án. Theo dự báo hiện tại, công ty có thể trả gốc và lãi đúng kế hoạch. Tuy nhiên, khả năng trả nợ sẽ yếu đi nếu các khách hàng lớn thanh toán chậm.", "questions": ["What is the most important point about Debt Service?", "Can you explain debt service in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 53, "month": 2, "title": "DSCR", "vocab": ["debt service coverage ratio", "cash available for debt service", "coverage", "repayment", "threshold", "buffer", "sensitivity"], "structures": ["DSCR stood at... times", "A ratio above/below... indicates...", "Under a stress scenario..."], "english": "The company's DSCR is around 1.4 times under the base case. This provides some buffer for debt repayment. Under a stress scenario with lower cash flow, the ratio falls close to one, so the bank should maintain appropriate monitoring and financial covenants.", "vietnamese": "DSCR của công ty khoảng 1,4 lần trong kịch bản cơ sở, tạo một mức đệm nhất định cho trả nợ. Trong kịch bản xấu với dòng tiền giảm, tỷ lệ này xuống gần 1 nên ngân hàng cần giám sát và áp dụng các cam kết tài chính phù hợp.", "questions": ["What is the most important point about DSCR?", "Can you explain debt service coverage ratio in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 54, "month": 2, "title": "EBITDA", "vocab": ["EBITDA", "operating earnings", "depreciation", "amortization", "earnings capacity", "operating profit", "leverage ratio"], "structures": ["EBITDA increased/decreased to...", "This provides...", "Relative to debt..."], "english": "EBITDA increased during the year, reflecting growth in operating earnings. However, debt also increased. I would compare debt to EBITDA to assess whether the company's borrowing level remains reasonable relative to its earnings capacity.", "vietnamese": "EBITDA tăng trong năm, phản ánh lợi nhuận hoạt động tốt hơn. Tuy nhiên, nợ cũng tăng. Tôi sẽ so sánh nợ với EBITDA để đánh giá mức vay có còn hợp lý so với năng lực tạo lợi nhuận hay không.", "questions": ["What is the most important point about EBITDA?", "Can you explain EBITDA in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 55, "month": 2, "title": "Interest Coverage", "vocab": ["interest coverage ratio", "EBIT", "EBITDA", "interest expense", "coverage level", "financing cost", "buffer"], "structures": ["Interest coverage was... times", "This suggests...", "If interest rates rise..."], "english": "Interest coverage remains acceptable at around three times. This means operating earnings are currently sufficient to cover interest expense. However, a rise in interest rates or a decline in profit could reduce this buffer.", "vietnamese": "Khả năng bao phủ lãi vay ở mức chấp nhận được, khoảng 3 lần. Điều này cho thấy lợi nhuận hoạt động hiện đủ để chi trả lãi. Tuy nhiên, lãi suất tăng hoặc lợi nhuận giảm có thể làm mức đệm này thu hẹp.", "questions": ["What is the most important point about Interest Coverage?", "Can you explain interest coverage ratio in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 56, "month": 2, "title": "Customer Concentration", "vocab": ["customer concentration", "top customer", "revenue dependence", "counterparty", "concentration risk", "diversification"], "structures": ["The top customer contributes...% of revenue", "This creates...", "Diversification would..."], "english": "The company's top three customers account for more than half of total revenue. This concentration creates risk because the loss or delayed payment of one major customer could materially affect cash flow. Diversifying the customer base would reduce this risk.", "vietnamese": "Ba khách hàng lớn nhất chiếm hơn một nửa doanh thu. Mức tập trung này tạo rủi ro vì việc mất hoặc chậm thanh toán của một khách hàng lớn có thể ảnh hưởng đáng kể đến dòng tiền. Đa dạng hóa khách hàng sẽ giúp giảm rủi ro.", "questions": ["What is the most important point about Customer Concentration?", "Can you explain customer concentration in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 57, "month": 2, "title": "Supplier Concentration", "vocab": ["supplier concentration", "key supplier", "procurement dependence", "supply disruption", "bargaining power", "input source"], "structures": ["The company relies heavily on...", "A disruption could...", "Alternative suppliers should..."], "english": "The company depends on a small number of key suppliers for important materials. This may create supply and pricing risk. I would assess whether alternative suppliers are available and whether the company has long-term purchasing arrangements.", "vietnamese": "Công ty phụ thuộc vào một số ít nhà cung cấp chính cho vật liệu quan trọng. Điều này có thể tạo rủi ro nguồn cung và giá. Tôi sẽ đánh giá khả năng có nhà cung cấp thay thế và các thỏa thuận mua dài hạn.", "questions": ["What is the most important point about Supplier Concentration?", "Can you explain supplier concentration in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 58, "month": 2, "title": "Financial Risk", "vocab": ["weak liquidity", "thin margin", "high leverage", "negative cash flow", "concentration risk", "refinancing risk", "covenant breach"], "structures": ["The main financial risks are...", "The most significant issue is...", "These risks may affect..."], "english": "The main financial risks are weak liquidity, high short-term leverage, thin profit margins and growing receivables. None of these factors alone necessarily makes the customer unbankable, but together they increase the need for close monitoring and disciplined facility structuring.", "vietnamese": "Các rủi ro tài chính chính gồm thanh khoản yếu, nợ ngắn hạn cao, biên lợi nhuận mỏng và khoản phải thu tăng. Từng yếu tố riêng lẻ chưa chắc khiến khách hàng không thể tài trợ, nhưng tổng hợp lại đòi hỏi giám sát chặt và cấu trúc hạn mức kỷ luật.", "questions": ["What is the most important point about Financial Risk?", "Can you explain weak liquidity in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 59, "month": 2, "title": "Credit Recommendation", "vocab": ["approve", "decline", "recommend", "subject to", "condition", "covenant", "limit", "collateral", "monitoring", "mitigant"], "structures": ["I recommend approval/decline because...", "Approval should be subject to...", "Key conditions include..."], "english": "I recommend approving the facility because the customer has a strong project pipeline and an acceptable repayment source. However, approval should be subject to conditions on debt levels, receivable monitoring and project-based disbursement.", "vietnamese": "Tôi đề xuất phê duyệt hạn mức vì khách hàng có danh mục dự án tốt và nguồn trả nợ chấp nhận được. Tuy nhiên, việc phê duyệt nên kèm điều kiện về mức nợ, giám sát khoản phải thu và giải ngân theo dự án.", "questions": ["What is the most important point about Credit Recommendation?", "Can you explain approve in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 60, "month": 2, "title": "Credit Assessment", "vocab": ["credit assessment", "financial analysis", "business risk", "repayment source", "facility structure", "covenant", "recommendation", "mitigant"], "structures": ["My overall assessment is...", "The key strengths are...", "The main risks are...", "I recommend..."], "english": "My overall assessment is that the customer is financeable but requires careful monitoring. The key strengths are its experience, project pipeline and market position. The main risks are thin margins, delayed receivables and relatively high leverage. I would recommend approval with appropriate limits and covenants.", "vietnamese": "Đánh giá tổng thể của tôi là khách hàng có thể được tài trợ nhưng cần giám sát chặt. Điểm mạnh là kinh nghiệm, danh mục dự án và vị thế thị trường. Rủi ro chính là biên lợi nhuận mỏng, khoản phải thu chậm và đòn bẩy tương đối cao. Tôi đề xuất phê duyệt với hạn mức và cam kết phù hợp.", "questions": ["What is the most important point about Credit Assessment?", "Can you explain credit assessment in your own words?", "How would you apply today's lesson to a real corporate-banking customer?"]}, {"day": 61, "month": 3, "title": "Construction English", "vocab": ["contractor", "subcontractor", "project owner", "beneficiary", "applicant", "guarantor", "receivable", "assignment", "recourse", "validity"], "structures": ["The key point is...", "This clause means that...", "The bank should assess whether...", "In this case, I would..."], "english": "Today I am discussing Construction English. In a construction project, I would connect contractor, subcontractor and project owner with the contractor's cash flow. Contract value alone is not enough; I need to understand progress, payment terms, cost overruns and collection timing. My conclusion should explain whether project execution is strong enough to support the requested banking facilities.", "vietnamese": "Hôm nay tôi trao đổi về Construction English. Trong dự án xây dựng, tôi sẽ liên hệ contractor, subcontractor và project owner với dòng tiền của nhà thầu. Chỉ nhìn giá trị hợp đồng là chưa đủ; cần hiểu tiến độ, điều khoản thanh toán, chi phí vượt dự toán và thời điểm thu tiền. Kết luận của tôi phả eans that...", "The bank should assess whether...", "In this case, I would..."], "english": "Today's topic is Supply-chain Finance. I would trace the transaction from the seller to the buyer and then to the bank. I would verify contractor, subcontractor and project owner, and confirm that the receivable is genuine, assignable and undisputed. I would also review payment history, concentration and the risk of duplicate financing. Only after these checks would I recommend an appropriate factoring limit.", "vietnamese": "Chủ đề hôm nay là Supply-chain Finance. Tôi sẽ lần theo giao dịch từ bên bán đến bên mua rồi đến ngân hàng. Tôi kiểm tra contractor, subcontractor và project owner, đồng thời xác nhận khoản phải thu là có thật, có thể chuyển nhượng và không tranh chấp. Tôi cũng rà soát lịch sử thanh toán, mức độ tập trung và rủi ro tài trợ trùng. Sau các bước này tôi mới đề xuất hạn mức bao thanh toán phù hợp.", "questions": ["Is the receivable eligible for financing?", "What buyer risk should the bank assess?", "How would you prevent duplicate financing?"]}, {"day": 90, "month": 3, "title": "Case tổng hợp", "vocab": ["contractor", "subcontractor", "project owner", "beneficiary", "applicant", "guarantor", "receivable", "assignment", "recourse", "validity"], "structures": ["The key point is...", "This clause means that...", "The bank should assess whether...", "In this case, I would..."], "english": "Today I am discussing Case tổng hợp. In a construction project, I would connect contractor, subcontractor and project owner with the contractor's cash flow. Contract value alone is not enough; I need to understand progress, payment terms, cost overruns and collection timing. My conclusion should explain whether project execution is strong enough to support the requested banking facilities.", "vietnamese": "Hôm nay tôi trao đổi về Case tổng hợp. Trong dự án xây dựng, tôi sẽ liên hệ contractor, subcontractor và project owner với dòng tiền của nhà thầu. Chỉ nhìn giá trị hợp đồng là chưa đủ; cần hiểu tiến độ, điều khoản thanh toán, chi phí vượt dự toán và thời điểm thu tiền. Kết luận của tôi phải cho thấy việc thực hiện dự án có đủ tốt để hỗ trợ các hạn mức ngân hàng được đề nghị hay không.", "questions": ["What project fact matters most today?", "How does this issue affect cash flow?", "Would you finance the contractor? Why?"]}, {"day": 91, "month": 4, "title": "Opening an Email", "vocab": ["regarding", "please provide", "follow up", "clarify", "confirm", "concern", "recommend", "agenda", "action item", "summarize"], "structures": ["I am writing regarding...", "Could you please...", "I would like to clarify...", "To summarize...", "We recommend that..."], "english": "Today's communication task is Opening an Email. I would keep the email short, polite and action-oriented. I would state the purpose in the first sentence, provide the necessary context, and make a clear request using regarding or please provide. A useful structure is: 'I am writing regarding...', 'Could you please...', and 'We would appreciate your response by...'. The reader should immediately understand what I need and what the next step is.", "vietnamese": "Nhiệm vụ giao tiếp hôm nay là Opening an Email. Tôi sẽ viết email ngắn, lịch sự và hướng đến hành động. Tôi nêu mục đích ngay câu đầu, cung cấp bối cảnh cần thiết và đưa ra yêu cầu rõ ràng bằng regarding hoặc please provide. Cấu trúc hữu ích là: 'I am writing regarding...', 'Could you please...', và 'We would appreciate your response by...'. Người đọc cần hiểu ngay tôi cần gì và bước tiếp theo là gì.", "questions": ["What is the purpose of your email?", "What action do you want the reader to take?", "Can you say the request in one clear sentence?"]}, {"day": 92, "month": 4, "title": "Requesting Information", "vocab": ["regarding", "please provide", "follow up", "clarify", "confirm", "concern", "recommend", "agenda", "action item", "summarize"], "structures": ["I am writing regarding...", "Could you please...", "I would
