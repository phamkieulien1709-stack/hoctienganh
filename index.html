const monthNames = [
  "Tháng 1 · Nền tảng Banking English",
  "Tháng 2 · Financial & Credit Analysis",
  "Tháng 3 · Construction / Guarantee / Factoring",
  "Tháng 4 · Email & Meeting English",
  "Tháng 5 · Speaking / Negotiation / Presentation",
  "Tháng 6 · Real-world Banking Simulation"
];
let activeMonth = 1;
const KEY = "english180-progress-v1";
let progress = JSON.parse(localStorage.getItem(KEY) || "{}");

function save() {
  localStorage.setItem(KEY, JSON.stringify(progress));
  updateProgress();
}
function getDayState(day) {
  if(!progress[day]) progress[day] = {checks:[false,false,false], date:"", note:""};
  return progress[day];
}
function isDone(day) {
  const s = getDayState(day);
  return s.checks.every(Boolean);
}
function updateProgress() {
  let doneDays=0, doneTasks=0;
  curriculum.forEach(d=>{
    const s=getDayState(d.day);
    doneTasks += s.checks.filter(Boolean).length;
    if(s.checks.every(Boolean)) doneDays++;
  });
  document.getElementById("progressText").textContent = `${doneDays}/180 ngày`;
  document.getElementById("taskText").textContent = `${doneTasks}/540 lượt luyện đã hoàn thành`;
  document.getElementById("progressFill").style.width = `${doneDays/180*100}%`;
  const dates=[...new Set(curriculum.map(d=>getDayState(d.day).date).filter(Boolean))].sort().reverse();
  let streak=0;
  if(dates.length){
    const MS=86400000, today=new Date(); today.setHours(0,0,0,0);
    const latest=new Date(dates[0]+"T00:00:00");
    if((today-latest)/MS<=1){
      let cur=latest, set=new Set(dates);
      while(set.has(cur.toISOString().slice(0,10))){streak++;cur=new Date(cur.getTime()-MS);}
    }
  }
  document.getElementById("streakText").textContent=`🔥 Streak: ${streak} ngày`;
  document.querySelectorAll(".dayCard").forEach(card=>{
    const day=+card.dataset.day, st=card.querySelector(".status");
    if(isDone(day)){st.textContent="Đã hoàn thành";st.classList.add("done")}
    else{st.textContent="Đang học";st.classList.remove("done")}
  });
}

function renderTabs(){
  const el=document.getElementById("monthTabs");
  el.innerHTML="";
  monthNames.forEach((name,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(activeMonth===i+1?" active":"");
    b.textContent=name;
    b.onclick=()=>{activeMonth=i+1;renderTabs();renderDays();};
    el.appendChild(b);
  });
}

function esc(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function renderDays(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  const sf=document.getElementById("statusFilter").value;
  const list=document.getElementById("dayList");
  const rows=curriculum.filter(d=>{
    if(d.month!==activeMonth) return false;
    const hay=(d.title+" "+d.vocab.join(" ")+" "+d.structures.join(" ")+" "+d.english+" "+d.vietnamese).toLowerCase();
    if(q && !hay.includes(q)) return false;
    if(sf==="done" && !isDone(d.day)) return false;
    if(sf==="todo" && isDone(d.day)) return false;
    return true;
  });
  if(!rows.length){list.innerHTML='<div class="empty">Không tìm thấy bài học phù hợp.</div>';return;}
  list.innerHTML=rows.map(d=>{
    const s=getDayState(d.day);
    const checks=s.checks;
    const vocab=d.vocab.map(v=>`<span class="tag">${esc(v)}</span>`).join("");
    const structs=d.structures.map(v=>`<span class="tag">${esc(v)}</span>`).join("");
    return `
    <article class="dayCard" data-day="${d.day}">
      <div class="dayHead" onclick="this.parentElement.classList.toggle('open')">
        <div class="dayNum">${d.day}</div>
        <div class="dayTitle"><h3>${esc(d.title)}</h3><div>Ngày ${d.day} · ${monthNames[d.month-1]}</div></div>
        <div class="status ${isDone(d.day)?'done':''}">${isDone(d.day)?'Đã hoàn thành':'Đang học'}</div>
      </div>
      <div class="content">
        <div class="grid2">
          <div class="section"><h4>📚 Từ vựng cần quan tâm</h4><div class="tags">${vocab}</div></div>
          <div class="section"><h4>🧩 Cấu trúc cần bật phản xạ</h4><div class="tags">${structs}</div></div>
        </div>
        <div class="grid2" style="margin-top:14px">
          <div class="section"><h4>🎤 Nội dung gợi ý nói bằng tiếng Anh</h4><div class="speech">${esc(d.english)}</div></div>
          <div class="section"><h4>🇻🇳 Dịch tiếng Việt</h4><div class="speech vn">${esc(d.vietnamese)}</div></div>
        </div>
        <div class="section" style="margin-top:14px">
          <h4>⚡ Câu hỏi luyện phản xạ</h4>
          <div class="questions">${(d.questions||[]).map((q,i)=>`<div class="q"><b>${i+1}.</b> ${esc(q)}</div>`).join("")}</div>
          <div class="legend">Mục tiêu: trả lời mỗi câu trong 5 giây, không dịch sang tiếng Việt trước.</div>
        </div>
        <div class="section" style="margin-top:14px">
          <h4>✅ 3 lượt luyện phản xạ</h4>
          <div class="tasks">
            <div class="task"><label><input type="checkbox" data-check="0" ${checks[0]?'checked':''}> <span><b>Lần 1</b><br>Đọc to bài mẫu 2 lần, chú ý phát âm và nhịp câu.</span></label></div>
            <div class="task"><label><input type="checkbox" data-check="1" ${checks[1]?'checked':''}> <span><b>Lần 2</b><br>Che bài và nói lại bằng ý của mình, không cần giống nguyên văn.</span></label></div>
            <div class="task"><label><input type="checkbox" data-check="2" ${checks[2]?'checked':''}> <span><b>Lần 3</b><br>Đổi số liệu/tình huống và nói lại để luyện phản xạ thực tế.</span></label></div>
          </div>
          <div class="completeRow">
            <textarea class="note" placeholder="Ghi chú: lỗi phát âm, từ khó nhớ, câu muốn luyện thêm...">${esc(s.note||"")}</textarea>
            <input class="date" type="date" value="${esc(s.date||"")}" title="Ngày hoàn thành">
          </div>
          <div class="legend">Ngày hoàn thành có thể nhập thủ công; nếu bạn tick đủ 3 lần mà chưa có ngày, hệ thống sẽ tự điền ngày hôm nay.</div>
        </div>
      </div>
    </article>`;
  }).join("");

  document.querySelectorAll(".dayCard").forEach(card=>{
    const day=+card.dataset.day;
    card.querySelectorAll('input[type="checkbox"]').forEach(cb=>{
      cb.addEventListener("change", e=>{
        const s=getDayState(day);
        s.checks[+e.target.dataset.check]=e.target.checked;
        if(s.checks.every(Boolean) && !s.date){
          const now=new Date();
          const local=new Date(now.getTime()-now.getTimezoneOffset()*60000).toISOString().slice(0,10);
          s.date=local;
          card.querySelector(".date").value=local;
        }
        save();
      });
    });
    card.querySelector(".date").addEventListener("change",e=>{getDayState(day).date=e.target.value;save();});
    card.querySelector(".note").addEventListener("input",e=>{getDayState(day).note=e.target.value;save();});
  });
  updateProgress();
}

document.getElementById("search").addEventListener("input",renderDays);
document.getElementById("statusFilter").addEventListener("change",renderDays);
document.getElementById("todayBtn").addEventListener("click",()=>{
  const target=curriculum.find(d=>!isDone(d.day)) || curriculum[curriculum.length-1];
  activeMonth=target.month; renderTabs(); renderDays();
  setTimeout(()=>{
    const card=document.querySelector(`.dayCard[data-day="${target.day}"]`);
    if(card){card.classList.add("open","todayMark");card.scrollIntoView({behavior:"smooth",block:"center"});
      setTimeout(()=>card.classList.remove("todayMark"),1800);}
  },60);
});

document.getElementById("resetBtn").addEventListener("click",()=>{
  if(confirm("Bạn có chắc muốn xóa toàn bộ tiến độ học đã lưu trên trình duyệt này?")){
    progress={};localStorage.removeItem(KEY);renderDays();
  }
});
renderTabs();renderDays();updateProgress();
</script>
</body>
</html>
